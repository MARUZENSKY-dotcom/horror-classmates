<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Shift: Haunted School</title>
<style>
:root{--bg:#06080c;--fg:#cfe8d8;--ac:#e23b3b;--pn:#0e1520;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:ui-monospace,Menlo,Consolas,monospace}
body{display:flex;flex-direction:column;align-items:center;justify-content:center}#rot{display:none;margin:10px;font-size:13px;text-align:center;color:#8fb89c}@media(orientation:portrait){#rot{display:block}}
#wrap{position:relative;width:min(100vw,calc((100vh - 8px)*16/9));aspect-ratio:16/9;background:#000;overflow:hidden}
canvas{width:100%;height:100%;image-rendering:pixelated;display:block;touch-action:none}
#ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.5em;background:rgba(0,0,0,.74);text-align:center;font-size:clamp(9px,1.7vw,16px)}
#ov.h{display:none}
h1{margin:0 0 .3em;font-size:2.4em;letter-spacing:.15em;color:var(--ac);text-shadow:0 0 12px #a00}
h1 small{display:block;font-size:.4em;color:var(--fg);letter-spacing:.4em}
h2{margin:0;color:var(--ac)}
button{font:inherit;background:var(--pn);color:var(--fg);border:2px solid #3a4a5c;padding:.4em 1.6em;min-width:14em;cursor:pointer}
button:hover:not(:disabled),button:focus-visible{border-color:var(--ac);color:#fff;outline:none}button:disabled{opacity:.35}
label{display:flex;gap:.6em;align-items:center}
.grid{display:grid;grid-template-columns:auto 8em 2em;gap:.2em .6em;align-items:center;text-align:left}
#fx{position:absolute;inset:0;pointer-events:none}
.crt #fx{background:repeating-linear-gradient(rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65));animation:fl 4s infinite}
@keyframes fl{0%,100%{opacity:1}48%{opacity:.9}50%{opacity:.7}52%{opacity:.95}}
@media(prefers-reduced-motion:reduce){.crt #fx{animation:none}}
</style></head><body>

function AC(){if(!audio){try{audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createGain();master.gain.value=vol;master.connect(audio.destination);amb()}catch(e){}}if(audio&&audio.state==='suspended')audio.resume()}
function nb(s){const b=audio.createBuffer(1,audio.sampleRate*s,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;return b}
function amb(){const s=audio.createBufferSource();s.buffer=nb(2);s.loop=true;const f=audio.createBiquadFilter();f.type='bandpass';f.frequency.value=2600;f.Q.value=.4;const n=audio.createGain();n.gain.value=.05;s.connect(f);f.connect(n);n.connect(master);s.start();
const w=audio.createBufferSource();w.buffer=nb(2);w.loop=true;const lf=audio.createBiquadFilter();lf.type='lowpass';lf.frequency.value=300;const o=audio.createOscillator();o.frequency.value=.15;const og=audio.createGain();og.gain.value=200;o.connect(og);og.connect(lf.frequency);const wg=audio.createGain();wg.gain.value=.08;w.connect(lf);lf.connect(wg);wg.connect(master);w.start();o.start()}
function tone(f,d,ty='square',v=.1,f2){const o=audio.createOscillator(),n=audio.createGain(),t=audio.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(n);n.connect(master);o.start(t);o.stop(t+d)}
function nz(d,v,fc,ty='lowpass'){const s=audio.createBufferSource();s.buffer=nb(d);const f=audio.createBiquadFilter();f.type=ty;f.frequency.value=fc;const n=audio.createGain(),t=audio.currentTime;n.gain.setValueAtTime(v,t);n.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(n);n.connect(master);s.start()}

function newGame(n,lev){const m=n>7?5:n;G={n,cust:lev,t:0,len:270,power:100,ld:false,rd:false,mon:false,cam:'ENT',fl:false,out:false,outT:0,scare:null,scareT:0,glitch:0,tick:0,cardT:2.4,amb:rr(10,20),use:0,
a:ANIM.map((a,i)=>({...a,room:a.start,lvl:lev?lev[i]:Math.min(20,a.ai+(m-1)*2.6),mt:rr(3,6),atk:0,cd:0,seen:0}))};G.iv=Math.max(2.6,7.5-(m-1)*.8);G.sm=m}
function nbrs(a,r){if(a.side==='W')return({PLAY:['ROOF'],ROOF:['PLAY','WIN'],WIN:[]})[r]||[];const l=[...GR[r]];if(r==='HA'&&a.side==='L')l.push('L');if(r==='HB'&&a.side==='R')l.push('R');return l}
function next(a){const goal=a.side==='W'?'WIN':a.side,nx=nbrs(a,a.room);if(!nx.length)return null;
if(R()<.5+G.sm*.06){const q=[[a.room]],sn=new Set([a.room]);while(q.length){const p=q.shift(),r=p[p.length-1];if(r===goal)return p[1];for(const n of nbrs(a,r))if(!sn.has(n)){sn.add(n);q.push([...p,n])}}}return pick(nx)}
function retreat(a){a.room=a.room==='L'?'HA':a.room==='R'?'HB':'ROOF';a.cd=rr(4,8);a.seen=0}
function doScare(a){if(G.scare)return;G.scare=a;G.scareT=0;G.mon=false;G.fl=false;sfx('scare')}
function ai(a,dt){if(a.cd>0){a.cd-=dt;return}
if(a.room==='L'||a.room==='R'||a.room==='WIN'){a.atk-=dt;
if(a.room==='WIN'){if(G.fl&&!G.out){a.seen+=dt;if(a.seen>1.1){retreat(a);sfx('metal');return}}else a.seen=Math.max(0,a.seen-dt*.5)}
if(a.atk<=0){const cl=a.room==='L'?G.ld:a.room==='R'?G.rd:false;if(cl){retreat(a);sfx('knock')}else doScare(a)}return}
a.mt-=dt;if(a.mt>0)return;a.mt=G.iv*a.spd*rr(.7,1.3);
if(R()*20<a.lvl){const n=next(a);if(!n)return;if((n==='L'||n==='R'||n==='WIN')&&G.a.some(o=>o.room===n))return;
const was=a.room;a.room=n;a.mv=1.5;sfx('step',a.i);if(n==='L'||n==='R'||n==='WIN')a.atk=Math.max(2.2,5.4-G.sm*.45);
if(G.mon&&(G.cam===was||G.cam===n))G.glitch=.4}}
function step(dt){if(G.cardT>0){G.cardT-=dt;return}
if(G.scare){G.scareT+=dt;if(G.scareT>1.7)over();return}
G.t+=dt;G.glitch=Math.max(0,G.glitch-dt);
G.use=G.out?0:.085+(G.ld?.16:0)+(G.rd?.16:0)+(G.mon?.13:0)+(G.fl?.1:0);G.power-=G.use*dt;
if(G.power<=0&&!G.out){G.power=0;G.out=true;G.ld=G.rd=G.mon=G.fl=false;G.outT=rr(10,18);sfx('out')}
if(G.out){G.outT-=dt;if(G.outT<=0)doScare(pick(G.a))}
if(Math.floor(G.t)>G.tick){G.tick=Math.floor(G.t);sfx('tick')}
G.amb-=dt;if(G.amb<=0){G.amb=rr(15,35);sfx(pick(['whisper','metal','whisper']))}
if(G.t>=G.len)return win();
G.a.forEach(a=>{a.mv=Math.max(0,(a.mv||0)-dt);ai(a,dt)})}
function togL(){if(G.out||G.scare)return;G.ld=!G.ld;sfx('door')}
function togR(){if(G.out||G.scare)return;G.rd=!G.rd;sfx('door')}
function togMon(){if(G.out||G.scare)return;G.mon=!G.mon;G.fl=false;G.glitch=.3;sfx('static')}
// ---------- drawing ----------
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(x|0,y|0,w|0,h|0)}
function txt(s,x,y,sz=8,c='#cfe8d8',al='left'){g.font='bold '+sz+'px ui-monospace,monospace';g.textAlign=al;g.fillStyle=c;g.fillText(s,x,y)}
function hsh(a,b,c){const x=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5;return x-Math.floor(x)}
function poly(p,c,s,ox=0,oy=0){g.fillStyle=c;g.beginPath();p.forEach((q,i)=>i?g.lineTo(ox+q[0]*s,oy+q[1]*s):g.moveTo(ox+q[0]*s,oy+q[1]*s));g.closePath();g.fill()}
function head(a,x,y,s,tilt,jaw){const t=G?G.t:0;g.save();g.translate(x+s/2,y+s/2);g.rotate(tilt);g.translate(-s/2,-s/2);
poly([[-.15,.25],[.05,-.3],[.3,.08]],a.col,s);poly([[1.15,.25],[.95,-.3],[.7,.08]],a.col,s);
rect(-.04*s,-.04*s,1.08*s,1.08*s,'#0b0d13');const im=IM[a.i];if(im&&im.complete&&im.naturalWidth)g.drawImage(im,0,0,s,s);
const n=6,d=1/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){poly([[i*d,j*d],[i*d+d,j*d],[i*d,j*d+d]],'rgba(0,0,12,'+hsh(a.i,i,j)*.42+')',s);poly([[i*d+d,j*d],[i*d+d,j*d+d],[i*d,j*d+d]],'rgba(0,0,12,'+hsh(a.i,j,i+9)*.42+')',s)}
poly([[0,0],[1,0],[.5,.22]],'rgba(0,0,0,.35)',s);
const gl=.55+.35*Math.sin(t*5+a.i);[.3,.7].forEach(e=>poly([[e-.1,.4],[e,.36],[e+.1,.4],[e,.44]],'rgba(255,20,20,'+gl+')',s));
if(jaw>.04){const h=Math.min(.3,jaw*.3);poly([[.18,.74],[.82,.74],[.74,.74+h],[.26,.74+h]],'#150000',s);for(let k=0;k<6;k++){const x0=.18+k*.107;poly([[x0,.74],[x0+.107,.74],[x0+.053,.74+h*.7]],'#e8e4d0',s);poly([[x0,.74+h],[x0+.107,.74+h],[x0+.053,.74+h*.3]],'#cfc9b4',s)}}
g.restore()}
function spr(a,cx,by,s,al=1){const t=(G?G.t:idleT*3)+a.i*1.7,mv=a.mv>0,att=a.room==='L'||a.room==='R'||a.room==='WIN',sw=mv?Math.sin(t*9):Math.sin(t*1.2)*.15,bob=mv?Math.abs(Math.sin(t*9))*.07:Math.sin(t*1.6)*.02;
if(mv&&R()<.3)cx+=(R()-.5)*6;const X=cx,Y=by-(3.4+bob)*s,P=(p,c)=>poly(p,c,s,X,Y);
g.save();g.globalAlpha=al;poly([[-.8,0],[0,-.12],[.8,0],[0,.12]],'rgba(0,0,0,.5)',s,cx,by);
const DK='#0f1218',MD='#1b2030',LT='#283046';
for(const d of[-1,1]){const f=d*sw*.25,hp=d*.25,k=d*.36+f*.5,ft=d*.3+f;
P([[hp-.2,2.3],[hp+.2,2.3],[k+.15,2.85],[k-.15,2.85]],d<0?MD:LT);P([[k-.15,2.85],[k+.15,2.85],[ft+.1,3.4],[ft-.1,3.4]],DK);P([[ft-.2,3.4],[ft+.2,3.4],[ft+.1,3.3],[ft-.1,3.3]],'#000')}
P([[-.75,1.2],[0,1.2],[0,2.3],[-.5,2.3]],MD);P([[0,1.2],[.75,1.2],[.5,2.3],[0,2.3]],LT);P([[-.3,1.2],[.3,1.2],[0,1.85]],DK);
P([[-.22,1.22],[0,1.32],[-.22,1.44]],a.col);P([[.22,1.22],[0,1.32],[.22,1.44]],a.col);
for(let i=0;i<5;i++)P([[-.5+i*.2,2.3],[-.4+i*.2,2.45+hsh(a.i,i,3)*.15],[-.3+i*.2,2.3]],DK);
for(const d of[-1,1]){const sx=d*.75,sy=1.3,hx=d*(att?.55:.95)+(mv?sw*d*.12:0),hy=att?1.9+Math.sin(t*14)*.05:3+Math.sin(t*1.3+d)*.05,ex=d*1.05,ey=(sy+hy)/2+.1;
P([[sx,sy-.13],[sx,sy+.13],[ex+.09,ey],[ex-.09,ey]],d<0?MD:LT);P([[ex-.09,ey],[ex+.09,ey],[hx+.07,hy],[hx-.07,hy]],DK);
for(let c=-1;c<=1;c++)P([[hx+c*.07-.035,hy],[hx+c*.07+.035,hy],[hx+c*.1,hy+.3]],'#d8d8c8')}
P([[-.15,.98],[.15,.98],[.24,1.25],[-.24,1.25]],DK);
const sn=hsh(a.i,Math.floor(t*4),1);
head(a,X-s/2,Y,s,Math.sin(t*.7)*.08+(sn>.9?(sn-.95)*5:0),.15+.15*Math.sin(t*2.3)+(att?.5:0)+(mv?.2:0));
g.restore()}
function stat(n){for(let i=0;i<n;i++)rect(R()*W,R()*H,2,1,'rgba(200,255,220,.35)')}
function drawRoom(r){const t=G.t,sky=r==='ROOF'||r==='PLAY';rect(0,0,W,H,sky?'#1a2430':'#2a3238');rect(0,170,W,100,sky?'#243020':'#1f2428');
switch(r){
case'HA':case'HB':for(let i=0;i<9;i++){rect(i*56-10,40,30,120,'#34414d');rect(i*56-4,60,3,50,'#111')}rect(0,165,W,3,'#555');break;
case'CAF':for(let i=0;i<3;i++){rect(40+i*140,150,110,14,'#5a4630');rect(48+i*140,164,6,30,'#333');rect(96+i*140,164,6,30,'#333')}break;
case'LIB':for(let i=0;i<6;i++){rect(i*80+8,30,60,140,'#3b2f26');for(let j=0;j<5;j++)rect(i*80+12,36+j*26,52,4,['#a33','#36a','#3a6','#aa3'][(i+j)%4])}break;
case'LAB':for(let i=0;i<3;i++){rect(30+i*150,140,120,20,'#27323a');rect(50+i*150,128,8,12,'#3c6');rect(80+i*150,124,8,16,'#c63')}break;
case'GYM':rect(200,20,80,50,'#ddd');rect(225,60,30,3,'#e67e22');rect(0,200,W,2,'#aa8');break;
case'MUS':rect(80,120,150,50,'#111');for(let i=0;i<14;i++)rect(84+i*10,150,8,18,'#ccc');break;
case'ROOF':rect(300,40,4,130,'#555');rect(285,60,34,3,'#555');rect(0,168,W,6,'#444');break;
case'STO':for(let i=0;i<7;i++)rect(30+i*60,150-(i%3)*30,50,40+(i%3)*30,'#4a3a22');break;
case'PLAY':rect(60,60,6,110,'#555');rect(220,60,6,110,'#555');rect(60,60,166,5,'#555');rect(120,65,2,60,'#777');rect(160,65,2,70,'#777');break;
case'ENT':rect(150,40,180,130,'#111');rect(154,44,84,122,'#3a5560');rect(242,44,84,122,'#3a5560');break;
case'OH':rect(10,50,70,120,'#0a0c10');rect(400,50,70,120,'#0a0c10');if(G.ld)rect(10,50,70,120,'#59616e');if(G.rd)rect(400,50,70,120,'#59616e');rect(200,70,80,100,'#202830');break}
if(sky)for(let i=0;i<40;i++)rect((i*53+t*70)%W,(i*31+t*190)%H,1,4,'#6f8fb0');
G.a.filter(a=>a.room===r||(r==='OH'&&(a.room==='L'&&!G.ld||a.room==='R'&&!G.rd))).forEach((a,k)=>{const oh=r==='OH';spr(a,(oh?(a.room==='L'?45:435):120+k*130)+Math.sin(t*.5+k)*(oh?4:14),oh?190:208,oh?34:40)})}
function drawCam(){drawRoom(G.cam);rect(0,0,W,H,'rgba(0,40,20,.4)');stat(220);
if(G.glitch>0||R()<.01){G.glitch=Math.max(G.glitch,.12);for(let k=0;k<5;k++){const sy=R()*H|0;g.drawImage(cv,0,sy,W,8,(R()-.5)*40,sy,W,8)}stat(500)}
txt('CAM '+String(CAMS.indexOf(G.cam)+1).padStart(2,'0')+' - '+NAME[G.cam],10,18,9,'#9fe8b8');
if((G.t*1.5|0)%2)rect(440,10,8,8,'#d22');txt('REC',436,18,8,'#d22','right');
CAMS.forEach((c,i)=>{const x=362+(i%4)*28,y=208+(i/4|0)*18;rect(x,y,26,16,c===G.cam?'#3a8a55':'#10201a');txt(String(i+1).padStart(2,'0'),x+13,y+11,8,'#cfe8d8','center')});
}
function drawOffice(){const o=G.out;rect(0,0,W,H,o?'#1a0808':'#151c28');rect(0,190,W,80,o?'#100606':'#0e1218');
rect(150,35,180,75,'#1d3a2c');rect(150,35,180,3,'#6b4a2a');txt('NO RUNNING IN HALLS',240,75,8,'#8fb89c','center');
rect(195,115,90,50,'#050a12');for(let i=0;i<30;i++)rect(195+(i*37+G.t*90)%88,115+(i*53+G.t*200)%48,1,4,'#6f8fb0');rect(195,113,90,2,'#555');rect(195,165,90,2,'#555');
const w=G.a.find(a=>a.room==='WIN');
if(w){g.save();g.beginPath();g.rect(195,115,90,50);g.clip();if(G.fl)spr(w,240,255,38);else{rect(222,135,5,4,'#f33');rect(253,135,5,4,'#f33')}g.restore()}
[[10,'L',G.ld],[400,'R',G.rd]].forEach(([x,s,cl])=>{rect(x,60,70,135,'#06080c');const a=G.a.find(a=>a.room===s);if(a&&!cl)spr(a,x+35,194,36,.9);
if(cl){rect(x,60,70,135,'#59616e');for(let i=0;i<9;i++)rect(x,66+i*15,70,2,'#3a414c')}rect(x-4,56,78,4,'#2b3340');
const bx=x;rect(bx,208,70,16,cl?'#8a2a2a':'#1c2a1f');txt((s==='L'?'[A] ':'[D] ')+(cl?'OPEN':'CLOSE'),bx+35,219,8,'#cfe8d8','center')});
if(G.fl){g.fillStyle='rgba(255,250,200,.12)';g.beginPath();g.moveTo(240,200);g.lineTo(150,90);g.lineTo(330,90);g.fill()}
rect(195,208,90,16,G.fl?'#8a7a2a':'#1c2a1f');txt('[F] FLASHLIGHT',240,219,8,'#cfe8d8','center');
rect(150,190,180,14,'#3a2a1c');
if(o){g.globalAlpha=.25+.2*Math.sin(G.t*6);rect(0,0,W,H,'#f00');g.globalAlpha=1;txt('POWER OUT',240,30,14,'#f33','center')}
else if(R()<.04)rect(0,0,W,H,'rgba(0,0,0,.35)')}
function hud(){const h=Math.floor(G.t/G.len*6);txt((h?h:12)+' AM',W-10,36,14,'#fff','right');txt('NIGHT '+G.n,W-10,50,8,'#8fb89c','right');
txt('POWER '+Math.ceil(G.power)+'%',10,H-30,10,G.power<20?'#f55':'#cfe8d8');
const u=Math.min(5,Math.round((G.use-.085)/.12)+1);txt('USAGE',10,H-18,8);for(let i=0;i<5;i++)rect(46+i*8,H-25,6,8,i<u&&!G.out?(i>2?'#e44':'#4c6'):'#223');
rect(170,H-24,140,16,'#10161f');txt(G.mon?'[SPACE] CLOSE MONITOR':'[SPACE] MONITOR',240,H-13,8,'#cfe8d8','center');txt('ESC: PAUSE',10,14,7,'#6c7a88')}
function drawScare(){const a=G.scare,tt=G.scareT,s=Math.min(260,120+tt*300);rect(0,0,W,H,tt%.1<.05?'#400':'#000');
for(const d of[-1,1]){const sx=W/2+d*230,hx=W/2+d*s*.62+(R()-.5)*8,hy=H*.3;poly([[sx-24,H],[sx+24,H],[hx+10,hy],[hx-10,hy]],'#10131a',1);for(let c=-1;c<=1;c++)poly([[hx+c*14-5,hy],[hx+c*14+5,hy],[hx+c*18,hy-45]],'#d8d8c8',1)}
head(a,W/2-s/2+(R()-.5)*16,H-s*1.05+(R()-.5)*16,s,(R()-.5)*.3,.9+R()*.3);
g.globalAlpha=.35;rect(0,0,W,H,'#d00');g.globalAlpha=1;stat(900);txt(a.name,W/2,22,12,'#f33','center')}
function render(){g.save();
if(!G||S==='menu'||S==='over'||S==='win'){idleT+=.016;rect(0,0,W,H,'#05070b');stat(500);if(S==='menu'&&(idleT%7)<.35){const a=ANIM[(idleT/7|0)%5];spr(a,W/2,H,90,.35)}if(S==='over'&&G&&G.scare){/* keep dark */}g.restore();return}
if(G.scare)drawScare();else{if(G.mon)drawCam();else drawOffice();hud();
if(G.cardT>0){rect(0,0,W,H,'#000');txt('NIGHT '+G.n,W/2,125,24,'#fff','center');txt('12:00 AM',W/2,150,12,'#8fb89c','center')}}
g.restore()}
// ---------- ui ----------
function ov(h){ovEl.className='';ovEl.innerHTML=h}function hide(){ovEl.className='h'}
function menu(){S='menu';const c=night;ov(`<h1>NIGHT SHIFT<small>HAUNTED SCHOOL</small></h1><button onclick="start(1)">Start game</button><button ${c>1?'':'disabled'} onclick="start(${c})">Continue${c>1?' (night '+c+')':''}</button><button onclick="custom()">Custom night</button><button onclick="settings('menu')">Settings</button><button onclick="credits()">Credits</button><button onclick="exitG()">Exit</button>`)}
function start(n,lev){AC();newGame(n,lev);S='play';hide()}
function custom(){S='menu';ov(`<h2>CUSTOM NIGHT</h2><div class="grid">${ANIM.map((a,i)=>`<span>${a.name}</span><input type="range" min="0" max="20" value="${a.ai*3}" id="cl${i}" oninput="this.nextElementSibling.textContent=this.value"><b>${a.ai*3}</b>`).join('')}</div><button onclick="start(8,ANIM.map((a,i)=>+document.getElementById('cl'+i).value))">Start</button><button onclick="menu()">Back</button>`)}
function settings(from){prev=from;ov(`<h2>SETTINGS</h2><label>Volume <input type="range" min="0" max="100" value="${vol*100}" oninput="vol=this.value/100;if(master)master.gain.value=vol"></label><label><input type="checkbox" ${crt?'checked':''} onchange="crt=this.checked;wrap.classList.toggle('crt',crt)"> CRT filter</label><button onclick="${from==='pause'?'pauseUI()':'menu()'}">Back</button>`)}
function credits(){ov(`<h2>CREDITS</h2><p>Design and code: Claude<br>Faces: your friends, pixelated<br>Sound: synthesized in your browser</p><button onclick="menu()">Back</button>`)}
function exitG(){ov(`<h2>THANKS FOR PLAYING</h2><p>You can close this tab now.</p><button onclick="menu()">Back</button>`);try{window.close()}catch(e){}}
function pauseUI(){S='pause';ov(`<h2>PAUSED</h2><button onclick="resume()">Resume</button><button onclick="start(G.n,G.cust)">Restart</button><button onclick="settings('pause')">Settings</button><button onclick="menu()">Quit</button>`)}
function resume(){S='play';hide()}
function over(){S='over';const sc=Math.floor((G.n>7?0:(G.n-1)*1000)+G.t*10),h=Math.floor(G.t/G.len*6);ov(`<h2>YOU WERE CAUGHT</h2><p>Night reached: ${G.n}<br>Time survived: ${h?h:12}:${String(Math.floor(G.t%45/45*60)).padStart(2,'0')} AM<br>Score: ${sc}</p><button onclick="start(${G.n})">Retry</button><button onclick="menu()">Main menu</button>`)}
function win(){S='win';sfx('bell');const n=G.n;if(n<7){night=n+1;sv('night',night)}ov(`<h2>6:00 AM</h2><p>${n===7?'You survived all seven nights.':'You survived night '+n+'.'}</p>${n<7?`<button onclick="start(${n+1})">Next night</button>`:''}<button onclick="menu()">Main menu</button>`)}
// ---------- input ----------
addEventListener('keydown',e=>{AC();if(e.repeat)return;const k=e.key.toLowerCase();
if(k==='escape'||k==='p'){if(S==='play')pauseUI();else if(S==='pause')resume();return}
if(S!=='play'||G.cardT>0)return;
if(k==='a'||k==='arrowleft')togL();else if(k==='d'||k==='arrowright')togR();else if(k===' '){e.preventDefault();togMon()}
else if(k==='f'&&!G.mon&&!G.out&&!G.scare)G.fl=true;
else if(G.mon&&/^[0-9]$/.test(k)){const c=CAMS[(+k||10)-1];if(c){G.cam=c;G.glitch=.3;sfx('static')}}});
addEventListener('keyup',e=>{if(e.key.toLowerCase()==='f'&&G)G.fl=false});
cv.addEventListener('pointerdown',e=>{AC();if(S!=='play'||G.scare||G.cardT>0)return;const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)/b.width*W,y=(e.clientY-b.top)/b.height*H,hit=(a,c,w,h)=>x>=a&&x<=a+w&&y>=c&&y<=c+h;
if(hit(170,H-24,140,16)){togMon();return}
if(G.mon){CAMS.forEach((c,i)=>{if(hit(362+(i%4)*28,208+(i/4|0)*18,26,16)){G.cam=c;G.glitch=.3;sfx('static')}});return}
if(hit(10,208,70,16))togL();else if(hit(400,208,70,16))togR();else if(hit(195,208,90,16)&&!G.out)G.fl=true});
addEventListener('pointerup',()=>{if(G)G.fl=false});
let last=performance.now();
function showErr(m){ovEl.className='';ovEl.innerHTML='<h2>ERROR</h2><p style="max-width:90%;word-break:break-word">'+String(m)+'</p><button onclick="location.reload()">Reload</button>'}
window.addEventListener('error',e=>showErr((e.message||'error')+' (line '+e.lineno+')'));
function loop(n){const dt=Math.min(.1,(n-last)/1000);last=n;try{if(S==='play')step(dt);render()}catch(e){S='menu';showErr(e&&e.stack?e.stack.split('\n').slice(0,2).join(' | '):e)}requestAnimationFrame(loop)}
menu();requestAnimationFrame(loop);
</script></body></html>
